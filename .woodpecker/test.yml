when:
  - event: pull_request
  - event: push
    branch: main

# Pin to the dedicated CI runner, which mounts the persistent Gradle caches.
# (Registered for the org during the Flutter era; the label carries over.)
labels:
  runner: openvitals

variables:
  # Prebaked CI image: cirruslabs/android-sdk:tools plus the Android platform
  # and build-tools this app compiles against (see ci-image/Dockerfile), so no
  # sdkmanager runs at CI time. Rebuild + push (scripts/build-ci-image.sh
  # --push) and bump this tag together when compileSdk moves. The package is
  # private on ghcr; the runner's registry credentials cover it, as they did
  # the Flutter era's image.
  - &android_image ghcr.io/mmarca-tech/openvitals-android-ci:android-37

steps:
  - name: unit-tests
    image: *android_image
    commands:
      - set -eu
      - scripts/ci-android-gradle.sh verifyCiUnitTest

  - name: app-preflight
    depends_on:
      - unit-tests
    image: *android_image
    commands:
      - set -eu
      - scripts/ci-android-gradle.sh verifyCiPreflight
      - git diff --check
