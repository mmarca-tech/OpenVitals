name: notification_listener_native
description: >-
  App-local Flutter plugin bridging Flutter to Android's NotificationListener
  service, so phone notifications can be mirrored to a paired Garmin watch. Reads
  notifications, filters them natively, and wakes a headless Dart isolate to do
  the Bluetooth work. Android-only.
version: 0.0.1
publish_to: 'none'

# Resolved as part of the root `openvitals` pub workspace (see the app pubspec),
# so `flutter pub get` at the root covers this package too and there is no
# separate lockfile here.
resolution: workspace

environment:
  sdk: ^3.9.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  pigeon: ^27.1.0
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: tech.mmarca.openvitals.notification_listener_native
        pluginClass: NotificationListenerNativePlugin
